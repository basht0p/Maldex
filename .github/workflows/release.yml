name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, so a re-pushed tag cannot race gh release create; a queued run waits instead of cancelling one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg xorriso
      - name: Build packages
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = push ] && [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="0.0.0~dryrun+${SHA:0:12}"
          fi
          ./build.sh package "$VERSION"
      - name: Sign packages and checksums
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: packaging/ci/sign.sh dist
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Remove leftover signing state
        if: always()
        run: |
          rm -f "$HOME/.rpmmacros"
          rm -rf /tmp/maldex-gnupg.*
          gpgconf --kill gpg-agent || true

  smoke-deb:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Not a job container with a services: block: service containers start before the first step, so a password generated in
    # the job could not reach them. The sidecar is started by a step instead, on a user-defined network where the Ubuntu
    # container below reaches it by the name "mssql".
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Start SQL Server Express
        run: |
          # a throwaway SA password: generated here, masked before anything else, handed on only by environment
          pw="$(openssl rand -base64 24 | tr -d '/+=')Aa1"
          echo "::add-mask::$pw"
          echo "MSSQL_SA_PASSWORD=$pw" >> "$GITHUB_ENV"
          export MSSQL_SA_PASSWORD="$pw"
          docker network create smoke
          docker run -d --name mssql --network smoke -e ACCEPT_EULA=Y -e MSSQL_PID=Express -e MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2025-latest
          for _ in $(seq 1 90); do
            docker logs mssql 2>&1 | grep -q 'SQL Server is now ready for client connections' && exit 0
            sleep 2
          done
          echo "SQL Server did not become ready" >&2
          docker logs --tail 30 mssql >&2
          exit 1
      - name: Install the package and smoke
        run: |
          export MALDEX_SMOKE_SQL="Server=mssql,1433;Database=maldex;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
          docker run --rm --network smoke -e DEBIAN_FRONTEND=noninteractive -e MALDEX_SMOKE_SQL \
            -v "$PWD:/w:ro" -w /w ubuntu:24.04 bash -c '
              set -e
              apt-get update
              apt-get install -y ./dist/maldex_*.deb
              bash packaging/ci/smoke.sh deb'
      - name: Remove the SQL Server container
        if: always()
        run: |
          docker rm -f mssql || true
          docker network rm smoke || true

  smoke-rpm:
    needs: build
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    container: rockylinux:9
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify the signature and install
        run: |
          # the package pulls ~450 packages (libvirt/qemu); pick fast mirrors and download in parallel
          printf '\nfastestmirror=True\nmax_parallel_downloads=10\nretries=10\ninstall_weak_deps=False\n' >> /etc/dnf/dnf.conf
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          rpm --import dist/maldex-signing-key.asc
          rpm -K dist/maldex-*.rpm | tee /dev/stderr | grep -q 'signatures OK'
          dnf install -y ./dist/maldex-*.rpm
      - name: Smoke
        run: bash packaging/ci/smoke.sh rpm

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-deb, smoke-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Maldex server packages for Ubuntu 24.04 (.deb) and RHEL 9 and rebuilds (.rpm), x86_64.

          1. Verify: `gpg --import maldex-signing-key.asc`, then `gpg --verify SHA256SUMS.asc SHA256SUMS`, then `sha256sum -c SHA256SUMS`.
          2. Install: `sudo apt install ./maldex_*.deb`, or on RHEL `sudo dnf install epel-release`, enable crb, then `sudo dnf install ./maldex-*.rpm`.
          3. Edit `/etc/maldex/appsettings.Production.json`: the SQL Server connection string (single sign-on is optional; see the README).
          4. Run `sudo maldex-setup` (add `--offline <dir>` to use pre-downloaded Sysmon.zip and virtio-win.iso); it asks for the name and password of the first admin.
          5. Open the app through an SSH forward or a reverse proxy, sign in, then build the first template under Admin > Sandbox Templates > New template.

          Upgrading from a build that used Entra ID sign-in: local accounts replace it. Existing Entra users become disabled single sign-on users and keep their history; create the first admin with `maldex-setup` (or `sudo maldex-admin create-user <name> --admin`).

          The package grants the maldex service user passwordless sudo for a fixed list of commands and assumes a dedicated host.
          EOF
          gh release create "$TAG" \
            dist/maldex_*.deb dist/maldex-*.rpm \
            dist/SHA256SUMS dist/SHA256SUMS.asc dist/maldex-signing-key.asc \
            --title "Maldex ${TAG#v}" --notes-file notes.md
