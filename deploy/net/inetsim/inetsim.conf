# Maldex INetSim config: simulated internet services for a single run's namespace.
# Services bind all addresses inside the run namespace; the namespace is the isolation boundary.
# DNS is NOT started: dnsmasq owns port 53 on the gateway address (and answers the sinkhole for every name).
start_service http
start_service https
start_service smtp
start_service ftp

service_bind_address    0.0.0.0
dns_default_ip          198.18.0.10
dns_default_domainname  maldex.invalid
dns_version             "Maldex DNS"

# Writable locations are overridden per run with --data / --log / --report.
