# Installed by the maldex package as /usr/lib/systemd/system/guacd.service.d/maldex.conf.
# guacd listens on loopback only: Maldex's tunnel endpoint connects to 127.0.0.1:4822, and the guests' VNC consoles listen
# on 127.0.0.1. guacd runs in the foreground so one drop-in fits both the Ubuntu unit (forking, /etc/default/guacd) and the
# EPEL unit (-f $OPTS from /etc/sysconfig/guacd); the distro environment files are not read.
[Service]
Type=simple
PIDFile=
EnvironmentFile=
ExecStart=
ExecStart=/usr/sbin/guacd -f -b 127.0.0.1 -l 4822
