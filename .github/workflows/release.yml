name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg xorriso
      - name: Build packages
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="0.0.0~dryrun+${SHA:0:12}"
          fi
          ./build.sh package "$VERSION"
      - name: Sign packages and checksums
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: packaging/ci/sign.sh dist
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-deb:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the package
        run: |
          apt-get update
          apt-get install -y ./dist/maldex_*.deb
      - name: Smoke
        run: packaging/ci/smoke.sh deb

  smoke-rpm:
    needs: build
    runs-on: ubuntu-24.04
    container: rockylinux:9
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify the signature and install
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          rpm --import dist/maldex-signing-key.asc
          rpm -K dist/maldex-*.rpm
          dnf install -y ./dist/maldex-*.rpm
      - name: Smoke
        run: packaging/ci/smoke.sh rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-deb, smoke-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Maldex server packages for Ubuntu 24.04 (.deb) and RHEL 9 and rebuilds (.rpm), x86_64.

          1. Verify: `gpg --import maldex-signing-key.asc`, then `gpg --verify SHA256SUMS.asc SHA256SUMS`, then `sha256sum -c SHA256SUMS`.
          2. Install: `sudo apt install ./maldex_*.deb`, or on RHEL `sudo dnf install epel-release`, enable crb, then `sudo dnf install ./maldex-*.rpm`.
          3. Edit `/etc/maldex/appsettings.Production.json` (connection string, AzureAd).
          4. Run `sudo maldex-setup` (add `--offline <dir>` to use pre-downloaded Sysmon.zip and virtio-win.iso).
          5. Open the app through an SSH forward or a reverse proxy, then build the first template under Admin > Sandbox Templates > New template.

          The package grants the maldex service user passwordless sudo for a fixed list of commands and assumes a dedicated host.
          EOF
          gh release create "$TAG" \
            "dist/maldex_${TAG#v}_amd64.deb" \
            "dist/maldex-${TAG#v}-1.x86_64.rpm" \
            dist/SHA256SUMS dist/SHA256SUMS.asc dist/maldex-signing-key.asc \
            --title "Maldex ${TAG#v}" --notes-file notes.md
